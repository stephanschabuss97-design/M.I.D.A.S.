<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./session-shell.css?v=r6-s4-4">
  <title>Activity V2 Session Shell Harness</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #071019;
      color: #f2f8f9;
    }

    body {
      min-height: 100vh;
      margin: 0;
    }

    .harness-stage {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top, rgba(108, 224, 198, 0.14), transparent 30rem),
        #071019;
    }

    .harness-card {
      width: min(34rem, 100%);
      padding: 1.5rem;
      border: 1px solid rgba(173, 202, 218, 0.18);
      border-radius: 1rem;
      background: #111f2b;
    }

    .harness-card button {
      min-height: 44px;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(108, 224, 198, 0.4);
      border-radius: 0.75rem;
      color: #061b16;
      background: #6ce0c6;
      font: inherit;
      font-weight: 750;
    }

    .harness-fixtures {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-block: 1rem;
    }

    .harness-fixtures a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0.65rem 0.8rem;
      border: 1px solid rgba(108, 224, 198, 0.3);
      border-radius: 0.7rem;
      color: #bdeee3;
      text-decoration: none;
    }

    .harness-fixtures a[aria-current="page"] {
      color: #061b16;
      background: #6ce0c6;
    }

    #harness-fixture {
      margin: 0;
      color: #bdeee3;
      font-size: 0.85rem;
      overflow-wrap: anywhere;
    }

    #harness-status {
      display: block;
      margin-block: 1rem;
      color: #9db1bc;
    }
  </style>
</head>
<body>
  <main class="harness-stage" id="harness-background">
    <section class="harness-card" aria-labelledby="harness-title">
      <p>ISOLIERTER R6-HARNESS</p>
      <h1 id="harness-title">Activity V2 Session Shell</h1>
      <p>Diese Seite lädt ausschließlich lokale Semantik, Draft, UI-Shell und deterministische R6-Fixtures.</p>
      <nav class="harness-fixtures" aria-label="Harness-Szenario">
        <a data-fixture="empty" href="./session-shell-harness.html?fixture=empty">Leer</a>
        <a data-fixture="policies" href="./session-shell-harness.html?fixture=policies">Policy-Matrix</a>
        <a data-fixture="history" href="./session-shell-harness.html?fixture=history">Historyzustände</a>
        <a data-fixture="all" href="./session-shell-harness.html?fixture=all">Gesamtstress</a>
      </nav>
      <p id="harness-fixture">Fixture wird bestimmt …</p>
      <output id="harness-status" role="status" aria-live="polite">
        Initialisierung läuft …
      </output>
      <button id="harness-open" type="button">Session öffnen</button>
    </section>
  </main>

  <script>
    'use strict';
    globalThis.AppModules = {
      activity: { sentinel: 'activity-v1-unchanged' }
    };
  </script>
  <script src="./semantics.js"></script>
  <script src="./semantics-v2.js"></script>
  <script src="./session-draft.js"></script>
  <script src="./session-shell.js"></script>
  <script>
    'use strict';

    (function startActivityV2SessionHarness(root) {
      const status = document.getElementById('harness-status');
      const opener = document.getElementById('harness-open');
      const fixtureOutput = document.getElementById('harness-fixture');
      const fixtureName =
        new URLSearchParams(root.location.search).get('fixture') || 'empty';
      const fixtureNames = Object.freeze(['empty', 'policies', 'history', 'all']);
      const setFieldKeys = Object.freeze([
        'reps',
        'duration_sec',
        'distance_m',
        'weight_kg',
        'assistance_kg'
      ]);

      try {
        if (!fixtureNames.includes(fixtureName)) {
          throw new Error('invalid deterministic harness fixture');
        }
        const semantics = root.AppModules.activityV2.semanticsV2;
        const draft = root.AppModules.activityV2.sessionDraft.create({ semantics });
        const catalog = semantics.getCatalog();
        const policyRepresentatives = new Map();
        catalog.entries
          .filter(
            (entry) =>
              entry.status === 'active' && entry.tracking_mode === 'strength_sets'
          )
          .forEach((entry) => {
            const signature = setFieldKeys
              .map((fieldKey) => entry.fields[fieldKey])
              .join('|');
            if (!policyRepresentatives.has(signature)) {
              policyRepresentatives.set(signature, entry.key);
            }
          });
        if (policyRepresentatives.size !== 8) {
          throw new Error('invalid deterministic policy fixture');
        }
        const strengthPolicyKeys = Object.freeze([
          ...policyRepresentatives.values()
        ]);
        const itemPolicyKeys = Object.freeze(['cross_trainer', 'running']);
        const itemPolicyModes = Object.freeze(['duration', 'duration_distance']);
        itemPolicyKeys.forEach((itemKey, index) => {
          const entry = semantics.getEntryByKey(itemKey);
          if (
            entry.tracking_mode !== itemPolicyModes[index] ||
            entry.fields.duration_min !== 'required' ||
            entry.fields.note !== 'optional' ||
            entry.fields.distance_km !==
              (entry.tracking_mode === 'duration' ? 'forbidden' : 'optional')
          ) {
            throw new Error('invalid deterministic item policy fixture');
          }
        });
        const policyKeys = Object.freeze([
          ...strengthPolicyKeys,
          ...itemPolicyKeys
        ]);
        const historyKeys = Object.freeze([
          'bench_press',
          'ski_erg',
          'total_abdominal',
          'high_row',
          ...itemPolicyKeys
        ]);
        const selectedKeys = [];
        const addSelectedKey = (itemKey) => {
          if (!selectedKeys.includes(itemKey)) selectedKeys.push(itemKey);
        };
        if (fixtureName === 'policies' || fixtureName === 'all') {
          policyKeys.forEach(addSelectedKey);
        }
        if (fixtureName === 'history' || fixtureName === 'all') {
          historyKeys.forEach(addSelectedKey);
        }
        if (fixtureName === 'all') addSelectedKey('straight_arm_pulldown');
        selectedKeys.forEach((itemKey) => draft.addItem(itemKey));

        const validStressValues = Object.freeze({
          reps: '1000',
          duration_sec: '3600',
          distance_m: '10000,00',
          weight_kg: '1000,00',
          assistance_kg: '1000,00'
        });
        selectedKeys.forEach((itemKey) => {
          const entry = semantics.getEntryByKey(itemKey);
          if (entry.tracking_mode !== 'strength_sets') return;
          setFieldKeys.forEach((fieldKey) => {
            if (entry.fields[fieldKey] !== 'forbidden') {
              draft.setSetField(
                itemKey,
                1,
                fieldKey,
                validStressValues[fieldKey]
              );
            }
          });
        });
        if (fixtureName === 'policies' || fixtureName === 'all') {
          draft.setItemField('cross_trainer', 'duration_min', '30');
          draft.setItemField(
            'cross_trainer',
            'note',
            'R6-Duration-Fixture ohne Distanz.'
          );
          draft.setItemField('running', 'duration_min', '45');
          draft.setItemField('running', 'distance_km', '5,25');
          draft.setItemField(
            'running',
            'note',
            'R6-Duration-Distance-Fixture mit Rohwerten.'
          );
          draft.setItemField(
            strengthPolicyKeys[0],
            'note',
            'Gemeinsame R6-Itemnotiz am Strength-Editor.'
          );
        }
        if (selectedKeys.includes('bench_press')) {
          draft.setSetField('bench_press', 1, 'reps', '12');
          draft.setSetField('bench_press', 1, 'weight_kg', '77,50');
          draft.setSetField('bench_press', 2, 'reps', '13');
          draft.setSetField('bench_press', 2, 'weight_kg', '1000,001');
          draft.setSetField('bench_press', 3, 'reps', '8');
          draft.setSetField('bench_press', 3, 'weight_kg', '80,');
        }
        const lookupCounts = new Map();
        status.dataset.lookupCounts = '{}';
        status.dataset.fixture = fixtureName;
        status.dataset.fixtureKeys = JSON.stringify(selectedKeys);
        status.dataset.policyKeys = JSON.stringify(policyKeys);
        document.querySelectorAll('[data-fixture]').forEach((link) => {
          if (link.dataset.fixture === fixtureName) {
            link.setAttribute('aria-current', 'page');
          }
        });
        fixtureOutput.textContent =
          `Fixture: ${fixtureName} · ${selectedKeys.length} Einträge · ` +
          `${policyKeys.length} Policykombinationen`;
        const makeHistory = (itemKey) => {
          const entry = semantics.getEntryByKey(itemKey);
          const fields = entry.fields;
          const item = {
            id: '00000000-0000-4000-8000-000000000801',
            catalog_version: catalog.catalog_version,
            item_key: itemKey,
            item_order: 1,
            item_label_snapshot: entry.label,
            tracking_mode_snapshot: entry.tracking_mode,
            equipment_snapshot: entry.equipment,
            load_comparability_snapshot: entry.load_comparability,
            field_policy_snapshot: fields,
            duration_min: entry.tracking_mode === 'strength_sets' ? null : 45,
            distance_km: entry.tracking_mode === 'duration_distance' ? 5.25 : null,
            note: 'Lokaler R4-Harnesswert – nur zur Ansicht.',
            created_at: '2026-08-01T10:00:00.000000Z',
            sets: []
          };
          if (itemKey === 'high_row') {
            item.item_label_snapshot =
              'High Row / Sitzendes Rudern – historischer Gerätename mit langer Bezeichnung';
            item.note =
              'Lange historische Notiz: kontrollierte Bewegung, ruhige Exzentrik und vollständiger Bewegungsumfang. Literal <img src=x onerror=alert(1)> bleibt Text; English cue: keep the chest supported and the shoulders relaxed.';
          }
          if (entry.tracking_mode === 'strength_sets') {
            item.sets = [12, 13, 12].map((reps, index) => ({
              id: `00000000-0000-4000-8000-00000000080${index + 2}`,
              set_order: index + 1,
              tracking_mode: 'strength_sets',
              reps: fields.reps === 'required' ? reps : null,
              duration_sec: fields.duration_sec === 'required' ? 45 + index : null,
              distance_m: fields.distance_m === 'required' ? 30 + index : null,
              weight_kg: fields.weight_kg === 'forbidden' ? null : index === 2 ? 80 : 77.5,
              assistance_kg:
                fields.assistance_kg === 'required' ? 45 - index * 2.5 : null,
              created_at: '2026-08-01T10:00:00.000000Z'
            }));
          }
          return {
            schema_version: 'midas.activity-last-performance.v1',
            session: {
              id: '00000000-0000-4000-8000-000000000800',
              started_at: '2026-08-01T09:00:00.000000Z',
              day: '2026-08-01'
            },
            item
          };
        };
        const loadLastPerformance = (itemKey) => {
          lookupCounts.set(itemKey, (lookupCounts.get(itemKey) || 0) + 1);
          status.dataset.lookupCounts = JSON.stringify(Object.fromEntries(lookupCounts));
          if (itemKey === 'total_abdominal') {
            return Promise.reject(new Error('deterministic harness error'));
          }
          if (itemKey === 'ski_erg') return Promise.resolve(null);
          if (itemKey === 'bench_press') {
            return new Promise((resolve) => {
              root.setTimeout(() => resolve(makeHistory(itemKey)), 1500);
            });
          }
          return Promise.resolve(makeHistory(itemKey));
        };
        const shell = root.AppModules.activityV2.sessionShell.mount({
          host: document.body,
          draft,
          semantics,
          loadLastPerformance
        });
        const open = () => shell.open({ opener });
        opener.addEventListener('click', open);

        Object.defineProperty(root, 'activityV2SessionHarness', {
          value: Object.freeze({
            draft,
            shell,
            semantics,
            opener,
            fixture: fixtureName,
            fixtureKeys: Object.freeze(selectedKeys.slice()),
            policyKeys,
            strengthPolicyKeys,
            itemPolicyKeys,
            getLookupCount: (itemKey) => lookupCounts.get(itemKey) || 0
          }),
          enumerable: true,
          writable: false,
          configurable: false
        });
        status.textContent = 'Harness bereit.';
        open();
      } catch (error) {
        status.textContent = 'Harness konnte nicht initialisiert werden.';
        status.dataset.result = 'fail';
        throw error;
      }
    })(globalThis);
  </script>
</body>
</html>
